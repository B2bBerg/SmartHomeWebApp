services:
  # Der Webserver / Die App
  web-app:
    container_name: smarthome-web-app
    restart: unless-stopped
    build: ../backend/server
    ports:
      - "3001:3001"
    depends_on:
      dbStatic:
        condition: service_healthy
      dbTimeseries:
        condition: service_healthy
    environment:
      # Hauptuser
      APP_DB_USER: ${APP_DB_USER?Bitte APP_DB_USER in .env setzen}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD?Bitte APP_DB_PASSWORD in .env setzen}
      DB_HOST: dbStatic
      DB_STATIC_NAME: ${DB_STATIC_NAME:-smarthome_static}
    networks:
      - backend

  # Das Frontend (Web-UI)
  frontend:
    container_name: smarthome-frontend
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
    # Für echtes Hot-Reloading empfiehlt sich ein dediziertes 'docker-compose.override.yml', 
    # welches das Frontend Image überschreibt und einen Node-Dev-Server startet.
    networks:
      - backend

  # Die Datenbanken
  # Static
  dbStatic:
    container_name: smarthome-db-static
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "5432:5432" # Zugriff von aussen auf die statische DB
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
    volumes:
      - dbStatic-data:/var/lib/postgresql
      - ../backend/db/dbStaticData.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ../backend/db/dbStaticUsers.sh:/docker-entrypoint-initdb.d/02_users.sh:ro
      - ../backend/db/Inserts/permissionType.sql:/docker-entrypoint-initdb.d/03_permissionType.sql:ro
      - ../backend/db/Inserts/tileType.sql:/docker-entrypoint-initdb.d/04_tileType.sql:ro
      - ../backend/db/Inserts/unitType.sql:/docker-entrypoint-initdb.d/05_unitType.sql:ro
      - ../backend/db/Inserts/datapointType.sql:/docker-entrypoint-initdb.d/06_datapointType.sql:ro
      - ../backend/db/Inserts/busType.sql:/docker-entrypoint-initdb.d/07_busType.sql:ro
      - ../backend/db/Inserts/channelType.sql:/docker-entrypoint-initdb.d/08_channelType.sql:ro
      - ../backend/db/Inserts/manufacturer.sql:/docker-entrypoint-initdb.d/09_manufacturer.sql:ro
      - ../backend/db/Inserts/locationGroup.sql:/docker-entrypoint-initdb.d/10_locationGroup.sql:ro
      - ../backend/db/Inserts/locationType.sql:/docker-entrypoint-initdb.d/11_locationType.sql:ro
      - ../backend/db/Inserts/modelType.sql:/docker-entrypoint-initdb.d/12_modelType.sql:ro
      - ../backend/db/Inserts/obisDefinition.sql:/docker-entrypoint-initdb.d/13_obisDefinition.sql:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER?Bitte POSTGRES_USER in .env setzen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Bitte POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: ${DB_STATIC_NAME:-smarthome_static}
      APP_DB_USER: ${APP_DB_USER?Bitte APP_DB_USER in .env setzen}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD?Bitte APP_DB_PASSWORD in .env setzen}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${DB_STATIC_NAME:-smarthome_static}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - backend

  # Timeseries
  dbTimeseries:
    container_name: smarthome-db-time
    image: timescale/timescaledb:latest-pg18
    # Erhöht die Anzahl der parallelen Arbeiter, damit alle Timescale-Jobs (Retention, Aggregation) reibungslos laufen
    command: ["postgres", "-c", "max_worker_processes=25", "-c", "timescaledb.max_background_workers=20"]
    restart: unless-stopped
    ports:
      - "5433:5432" # Zugriff von aussen (über Port 5433) auf die Time-Series DB
    depends_on:
      dbStatic:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      POSTGRES_USER: ${POSTGRES_USER?Bitte POSTGRES_USER in .env setzen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Bitte POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: ${DB_TIME_NAME:-smarthome_time}
      APP_DB_USER: ${APP_DB_USER?Bitte APP_DB_USER in .env setzen}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD?Bitte APP_DB_PASSWORD in .env setzen}
      DB_STATIC_NAME: ${DB_STATIC_NAME:-smarthome_static}
    volumes:
      - dbTimeseries-data:/var/lib/postgresql
      - ../backend/db/dbTimeUsers.sh:/docker-entrypoint-initdb.d/01_users_and_fdw.sh:ro
      - ../backend/db/dbTimeData.sql:/docker-entrypoint-initdb.d/02_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${DB_TIME_NAME:-smarthome_time}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  dbStatic-data:
  dbTimeseries-data: