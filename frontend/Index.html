<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHome</title>
    <!-- 1. Globale Resets und Basis-Struktur -->
    <link rel="stylesheet" href="css/style.css">

    <!-- 2. Zentrale Variablen und Theme -->
    <link rel="stylesheet" href="index.css">

    <!-- 3. Globale Layout-Elemente -->
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/page.css">

    <!-- 4. Wiederverwendbare UI-Komponenten (Module) -->
    <link rel="stylesheet" href="css/modules/table.css">
    <link rel="stylesheet" href="css/modules/tile.css">
    <link rel="stylesheet" href="css/modules/switch.css">
    <link rel="stylesheet" href="css/modules/graph.css">

    <!-- 5. Spezifische Seiten/Ansichten -->
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/locations.css">
    <link rel="stylesheet" href="css/devices.css">
    <link rel="stylesheet" href="css/sensor.css">
    <link rel="stylesheet" href="css/actuators.css">
    <link rel="stylesheet" href="css/rules.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/users.css">
    <style>
        .not-implemented {
            opacity: 0.4;
            filter: grayscale(100%);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <img src="assets/alarm-clock-svgrepo-com.svg" alt="SmartHome Logo" class="logo">
        </div>
        <div class="header-right">
            <span class="header-icon not-implemented" title="Bald verfügbar"><img src="assets/icons/message-square-notification-svgrepo-com.svg" alt="Benachrichtigungen"></span>
            <span class="header-icon not-implemented" title="Bald verfügbar"><img src="assets/icons/user-svgrepo-com.svg" alt="Benutzerprofil"></span>
            <span class="header-icon not-implemented" title="Bald verfügbar"><img src="assets/icons/menu-svgrepo-com.svg" alt="Menü"></span>
        </div>
    </header>
    <nav id="sidebar">
        <ul>
            <li title="Dashboard"><span class="icon"><img src="assets/icons/menu-svgrepo-com.svg" alt=""></span><a href="#">Dashboard</a></li>
            <li title="Standorte">
                <span class="icon"><img src="assets/icons/house-chimney-user-svgrepo-com.svg" alt=""></span><a href="#">Standorte</a>
            </li>
            <li title="Geräte"><span class="icon"><img src="assets/icons/mobile-alt-svgrepo-com.svg" alt="D"></span><a href="#">Geräte</a></li>
            <li title="Sensoren"><span class="icon"><img src="assets/icons/mobile-signal-out-svgrepo-com.svg" alt=""></span><a href="#">Sensoren</a></li>
            <li title="Aktoren"><span class="icon"><img src="assets/icons/mobile-signal-svgrepo-com.svg" alt=""></span><a href="#">Aktoren</a></li>
            <li title="Regeln" class="not-implemented"><span class="icon"><img src="assets/icons/code-branch-svgrepo-com.svg" alt=""></span><a href="#">Regeln</a></li>
            <li title="Benutzer" class="not-implemented"><span class="icon"><img src="assets/icons/user-pen-svgrepo-com.svg" alt=""></span><a href="#">Benutzer</a></li>
            <!-- OPEN - HomeServerStatus -->
            <li title="Einstellungen" class="not-implemented"><span class="icon"><img src="assets/icons/gear-svgrepo-com.svg" alt=""></span><a href="#">Einstellungen</a></li>
        </ul>
        <button id="sidebar-toggle" title="Seitenleiste umschalten">
            <span class="icon"><img src="assets/icons/arrow-narrow-left-alignment-svgrepo-com.svg" alt="umschalten"></span>
        </button>
    </nav>

    <main id="content">
        <h1>Dashboard</h1>
        <div class="dashboard-container">
            <button id="Locations" class="tile dashboard-tile"><img src="assets/icons/house-chimney-user-svgrepo-com.svg" alt="">Standorte</button>
            <button id="Devices" class="tile dashboard-tile"><img src="assets/icons/mobile-alt-svgrepo-com.svg" alt="D">Geräte</button>
            <button id="Sensors" class="tile dashboard-tile"><img src="assets/icons/mobile-signal-out-svgrepo-com.svg" alt="">Sensoren</button>
            <button id="Actuators" class="tile dashboard-tile"><img src="assets/icons/mobile-signal-svgrepo-com.svg" alt="">Aktoren</button>
            <button id="Rules" class="tile dashboard-tile not-implemented"><img src="assets/icons/code-branch-svgrepo-com.svg" alt="">Regeln</button>
            <button id="Users" class="tile dashboard-tile not-implemented"><img src="assets/icons/user-pen-svgrepo-com.svg" alt="">Benutzer</button>
            <!-- OPEN - HomeServerStatus -->
            <button id="Settings" class="tile dashboard-tile not-implemented"><img src="assets/icons/gear-svgrepo-com.svg" alt="">Einstellungen</button>
        </div>
        <div class="overview-header">
            <h2>Übersicht</h2>
            <button id="edit-mode-btn" title="Layout bearbeiten"><img src="assets/icons/gear-svgrepo-com.svg" alt="edit">Bearbeiten</button>
            <button id="add-tile-btn" title="Kachel hinzufügen"><img src="assets/icons/grid-plus-svgrepo-com.svg" alt="add">Kachel hinzufügen</button>
        </div>
        <div class="overview-container"></div>

        <div id="tile-modal" class="tile-modal hidden">
            <div class="tile-modal-box">
                <h3>Kachel hinzufügen</h3>
                <div class="settings-group">
                    <label>Name</label>
                    <input id="tile-modal-input" type="text" placeholder="z.B. Luftfeuchtigkeit">
                </div>
                <div class="settings-group">
                    <label>Grösse</label>
                    <div class="tile-resize-cross">
                        <button id="add-btn-col-minus">&minus;&#9664;</button>
                        <button id="add-btn-col-plus">+&#9654;</button>
                        <button id="add-btn-row-minus">&minus;&#9650;</button>
                        <button id="add-btn-row-plus">+&#9660;</button>
                    </div>
                    <span id="add-size-display" class="size-display">1 &times; 1</span>
                </div>
                <div class="settings-group">
                    <label>Datenpunkt</label>
                    <select id="add-tile-datapoint">
                        <!-- API: Options dynamically injected via overview.js -->
                    </select>
                </div>
                <div class="settings-group">
                    <label>Inhalt</label>
                    <select id="add-tile-content">
                        <option value="">&mdash; Keine &mdash;</option>
                        <option value="temp-current">Temperatur &ndash; Aktueller Wert</option>
                        <option value="temp-graph">Temperatur &ndash; Graph</option>
                        <option value="energy-current">Energie &ndash; Aktueller Wert</option>
                        <option value="energy-graph">Energie &ndash; Graph</option>
                        <option value="switch-light">Schalter &ndash; Licht</option>
                        <option value="switch-shutter">Schalter &ndash; Rollladen</option>
                    </select>
                </div>
                <div class="tile-modal-actions">
                    <button id="tile-modal-confirm">Hinzufügen</button>
                    <button id="tile-modal-cancel">Abbrechen</button>
                </div>
            </div>
        </div>

        <div id="tile-settings-modal" class="tile-modal hidden">
            <div class="tile-modal-box">
                <h3>Kachel-Konfiguration</h3>
                <div class="settings-group">
                    <label>Name</label>
                    <input id="settings-tile-label" type="text">
                </div>
                <div class="settings-group">
                    <label>Datenpunkt</label>
                    <select id="settings-tile-datapoint">
                        <!-- API: Options dynamically injected via overview.js -->
                    </select>
                </div>
                <div class="settings-group">
                    <!-- API: Filter content options based on selected datapoint type -->
                    <label>Inhalt</label>
                    <select id="settings-tile-content">
                        <option value="">&mdash; Keine &mdash;</option>
                        <option value="temp-current">Temperatur &ndash; Aktueller Wert</option>
                        <option value="temp-graph">Temperatur &ndash; Graph</option>
                        <option value="energy-current">Energie &ndash; Aktueller Wert</option>
                        <option value="energy-graph">Energie &ndash; Graph</option>
                        <option value="switch-light">Schalter &ndash; Licht</option>
                        <option value="switch-shutter">Schalter &ndash; Rollladen</option>
                    </select>
                </div>
                <div class="tile-modal-actions">
                    <button id="tile-settings-delete" class="btn-danger">Löschen</button>
                    <div style="flex-grow:1"></div>
                    <button id="tile-settings-close">Schliessen</button>
                </div>
            </div>
        </div>
        </main>

    <!-- API -->
    <script type="module" src="js/api.js"></script>
    <!-- ROUTER -->
    <script src="js/modules/router.js"></script>
    <!-- MAIN -->
    <script src="js/main.js"></script>
    <!-- MODULES -->
    <script src="js/modules/dialog.js"></script>
    <script src="js/modules/graph.js"></script>
    <script src="js/modules/table.js"></script>
    <script src="js/modules/switch.js"></script>
    <script src="js/modules/tile.js"></script>
    <!-- SUB-MAINS -->
    <script src="js/dashboard.js"></script>
    <script src="js/locations.js"></script>
    <script src="js/devices.js"></script>
    <script src="js/sensors.js"></script>
    <script src="js/actuators.js"></script>
</body>
</html>
