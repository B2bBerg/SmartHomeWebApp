<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHome</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/overview.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <img src="assets/alarm-clock-svgrepo-com.svg" alt="SmartHome Logo" class="logo">
        </div>
        <div class="header-right">
            <span class="header-icon"><img src="assets/icons/message-square-notification-svgrepo-com.svg" alt="Notifications"></span>
            <span class="header-icon"><img src="assets/icons/user-svgrepo-com.svg" alt="User Profile"></span>
            <span class="header-icon"><img src="assets/icons/menu-svgrepo-com.svg" alt="Menu"></span>
        </div>
    </header>
    <nav id="sidebar">
        <ul>
            <li title="Dashboard"><span class="icon"><img src="assets/icons/menu-svgrepo-com.svg" alt=""></span><a href="#">Dashboard</a></li>
            <li title="Apartment">
                <span class="icon"><img src="assets/icons/house-chimney-user-svgrepo-com.svg" alt=""></span><a href="#">Apartment</a>
                <!-- OPEN - dynamic floor sub-items injected by main.js -->
            </li>
            <li title="Sensors"><span class="icon"><img src="assets/icons/sensor-svgrepo-com.svg" alt=""></span><a href="#">Sensors</a></li>
            <li title="Actuators"><span class="icon"><img src="assets/icons/mobile-signal-svgrepo-com.svg" alt=""></span><a href="#">Actuators</a></li>
            <li title="Rules"><span class="icon"><img src="assets/icons/code-branch-svgrepo-com.svg" alt=""></span><a href="#">Rules</a></li>
            <li title="Users"><span class="icon"><img src="assets/icons/user-pen-svgrepo-com.svg" alt=""></span><a href="#">Users</a></li>
            <!-- OPEN - HomeServerStatus -->
            <li title="Settings"><span class="icon"><img src="assets/icons/gear-svgrepo-com.svg" alt=""></span><a href="#">Settings</a></li>
        </ul>
        <button id="sidebar-toggle" title="Toggle sidebar">
            <span class="icon"><img src="assets/icons/arrow-narrow-left-alignment-svgrepo-com.svg" alt="toggle"></span>
        </button>
    </nav>

    <main id="content">
        <h1>Dashboard</h1>
        <div class="dashboard-container">
            <div class="tile dashboard-tile"><img src="assets/icons/house-chimney-user-svgrepo-com.svg" alt="">Apartment</div>
            <div class="tile dashboard-tile"><img src="assets/icons/mobile-signal-svgrepo-com.svg" alt="">Actuators</div>
            <div class="tile dashboard-tile"><img src="assets/icons/code-branch-svgrepo-com.svg" alt="">Rules</div>
            <div class="tile dashboard-tile"><img src="assets/icons/user-pen-svgrepo-com.svg" alt="">Users</div>
            <!-- OPEN - HomeServerStatus -->
            <div class="tile dashboard-tile"><img src="assets/icons/gear-svgrepo-com.svg" alt="">Settings</div>
        </div>
        <div class="overview-header">
            <h2>Overview</h2>
            <button id="edit-mode-btn" title="Edit layout"><img src="assets/icons/gear-svgrepo-com.svg" alt="edit">Edit</button>
            <button id="add-tile-btn" title="Add tile"><img src="assets/icons/grid-plus-svgrepo-com.svg" alt="add">Add Tile</button>
        </div>
        <div class="overview-container">
        </div>

        <div id="tile-modal" class="tile-modal hidden">
            <div class="tile-modal-box">
                <p>Tile Name</p>
                <input id="tile-modal-input" type="text" placeholder="e.g. Humidity">
                <div class="tile-modal-actions">
                    <button id="tile-modal-confirm">Add</button>
                    <button id="tile-modal-cancel">Cancel</button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/overview.js"></script>
</body>
</html>
