<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHome</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/overview.css">
    <link rel="stylesheet" href="css/sensor.css">
    <link rel="stylesheet" href="css/devices.css">
    <link rel="stylesheet" href="css/page.css">
    <link rel="stylesheet" href="css/apartment.css">
    <link rel="stylesheet" href="css/actuators.css">
    <link rel="stylesheet" href="css/rules.css">
    <link rel="stylesheet" href="css/users.css">
    <link rel="stylesheet" href="css/settings.css">

    <!-- MODULES -->
    <link rel="stylesheet" href="css/modules/table.css">
    <link rel="stylesheet" href="css/modules/graph.css">
    <link rel="stylesheet" href="css/modules/switch.css">
    <style>
        .not-implemented {
            opacity: 0.4;
            filter: grayscale(100%);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <img src="assets/alarm-clock-svgrepo-com.svg" alt="SmartHome Logo" class="logo">
        </div>
        <div class="header-right">
            <span class="header-icon not-implemented" title="Coming soon"><img src="assets/icons/message-square-notification-svgrepo-com.svg" alt="Notifications"></span>
            <span class="header-icon not-implemented" title="Coming soon"><img src="assets/icons/user-svgrepo-com.svg" alt="User Profile"></span>
            <span class="header-icon not-implemented" title="Coming soon"><img src="assets/icons/menu-svgrepo-com.svg" alt="Menu"></span>
        </div>
    </header>
    <nav id="sidebar">
        <ul>
            <li title="Dashboard"><span class="icon"><img src="assets/icons/menu-svgrepo-com.svg" alt=""></span><a href="#">Dashboard</a></li>
            <li title="Zuhause" class="not-implemented">
                <span class="icon"><img src="assets/icons/house-chimney-user-svgrepo-com.svg" alt=""></span><a href="#">Zuhause</a>
                <!-- OPEN - dynamic floor/room sub-items -->
            </li>
            <li title="Devices"><span class="icon"><img src="assets/icons/mobile-alt-svgrepo-com.svg" alt="D"></span><a href="#">Devices</a></li>
            <li title="Sensors"><span class="icon"><img src="assets/icons/mobile-signal-out-svgrepo-com.svg" alt=""></span><a href="#">Sensors</a></li>
            <li title="Actuators"><span class="icon"><img src="assets/icons/mobile-signal-svgrepo-com.svg" alt=""></span><a href="#">Actuators</a></li>
            <li title="Rules" class="not-implemented"><span class="icon"><img src="assets/icons/code-branch-svgrepo-com.svg" alt=""></span><a href="#">Rules</a></li>
            <li title="Users" class="not-implemented"><span class="icon"><img src="assets/icons/user-pen-svgrepo-com.svg" alt=""></span><a href="#">Users</a></li>
            <!-- OPEN - HomeServerStatus -->
            <li title="Settings" class="not-implemented"><span class="icon"><img src="assets/icons/gear-svgrepo-com.svg" alt=""></span><a href="#">Settings</a></li>
        </ul>
        <button id="sidebar-toggle" title="Toggle sidebar">
            <span class="icon"><img src="assets/icons/arrow-narrow-left-alignment-svgrepo-com.svg" alt="toggle"></span>
        </button>
    </nav>

    <main id="content">
        <h1>Dashboard</h1>
        <div class="dashboard-container">
            <button id="Zuhause" class="tile dashboard-tile not-implemented"><img src="assets/icons/house-chimney-user-svgrepo-com.svg" alt="">Zuhause</button>
            <button id="Devices" class="tile dashboard-tile"><img src="assets/icons/mobile-alt-svgrepo-com.svg" alt="D">Devices</button>
            <button id="Sensors" class="tile dashboard-tile"><img src="assets/icons/mobile-signal-out-svgrepo-com.svg" alt="">Sensors</button>
            <button id="Actuators" class="tile dashboard-tile"><img src="assets/icons/mobile-signal-svgrepo-com.svg" alt="">Actuators</button>
            <button id="Rules" class="tile dashboard-tile not-implemented"><img src="assets/icons/code-branch-svgrepo-com.svg" alt="">Rules</button>
            <button id="Users" class="tile dashboard-tile not-implemented"><img src="assets/icons/user-pen-svgrepo-com.svg" alt="">Users</button>
            <!-- OPEN - HomeServerStatus -->
            <button id="Settings" class="tile dashboard-tile not-implemented"><img src="assets/icons/gear-svgrepo-com.svg" alt="">Settings</button>
        </div>
        <div class="overview-header">
            <h2>Overview</h2>
            <button id="edit-mode-btn" title="Edit layout"><img src="assets/icons/gear-svgrepo-com.svg" alt="edit">Edit</button>
            <button id="add-tile-btn" title="Add tile"><img src="assets/icons/grid-plus-svgrepo-com.svg" alt="add">Add Tile</button>
        </div>
        <div class="overview-container"></div>

        <div id="tile-modal" class="tile-modal hidden">
            <div class="tile-modal-box">
                <h3>Add Tile</h3>
                <div class="settings-group">
                    <label>Name</label>
                    <input id="tile-modal-input" type="text" placeholder="e.g. Humidity">
                </div>
                <div class="settings-group">
                    <label>Size</label>
                    <div class="tile-resize-cross">
                        <button id="add-btn-col-minus">&minus;&#9664;</button>
                        <button id="add-btn-col-plus">+&#9654;</button>
                        <button id="add-btn-row-minus">&minus;&#9650;</button>
                        <button id="add-btn-row-plus">+&#9660;</button>
                    </div>
                    <span id="add-size-display" class="size-display">1 &times; 1</span>
                </div>
                <div class="settings-group">
                    <label>Datapoint</label>
                    <select id="add-tile-datapoint">
                        <!-- API: Options dynamically injected via overview.js -->
                    </select>
                </div>
                <div class="settings-group">
                    <label>Content</label>
                    <select id="add-tile-content">
                        <option value="">&mdash; None &mdash;</option>
                        <option value="temp-current">Temperature &ndash; Current Value</option>
                        <option value="temp-graph">Temperature &ndash; Graph</option>
                        <option value="energy-current">Energy &ndash; Current Value</option>
                        <option value="energy-graph">Energy &ndash; Graph</option>
                        <option value="switch-light">Switch &ndash; Light</option>
                        <option value="switch-shutter">Switch &ndash; Shutter</option>
                    </select>
                </div>
                <div class="tile-modal-actions">
                    <button id="tile-modal-confirm">Add</button>
                    <button id="tile-modal-cancel">Cancel</button>
                </div>
            </div>
        </div>

        <div id="tile-settings-modal" class="tile-modal hidden">
            <div class="tile-modal-box">
                <h3>Tile Configuration</h3>
                <div class="settings-group">
                    <label>Name</label>
                    <input id="settings-tile-label" type="text">
                </div>
                <div class="settings-group">
                    <label>Datapoint</label>
                    <select id="settings-tile-datapoint">
                        <!-- API: Options dynamically injected via overview.js -->
                    </select>
                </div>
                <div class="settings-group">
                    <!-- API: Filter content options based on selected datapoint type -->
                    <label>Content</label>
                    <select id="settings-tile-content">
                        <option value="">&mdash; None &mdash;</option>
                        <option value="temp-current">Temperature &ndash; Current Value</option>
                        <option value="temp-graph">Temperature &ndash; Graph</option>
                        <option value="energy-current">Energy &ndash; Current Value</option>
                        <option value="energy-graph">Energy &ndash; Graph</option>
                        <option value="switch-light">Switch &ndash; Light</option>
                        <option value="switch-shutter">Switch &ndash; Shutter</option>
                    </select>
                </div>
                <div class="tile-modal-actions">
                    <button id="tile-settings-delete" class="btn-danger">Delete</button>
                    <div style="flex-grow:1"></div>
                    <button id="tile-settings-close">Close</button>
                </div>
            </div>
        </div>
        </main>

    <!-- API -->
    <script src="js/api.js"></script>
    <!-- MAIN -->
    <script src="js/main.js"></script>
    <!-- MODULES -->
    <script src="js/modules/uuid.js"></script>
    <script src="js/modules/graph.js"></script>
    <script src="js/modules/table.js"></script>
    <script src="js/modules/switch.js"></script>
    <!-- SUB-MAINS -->
    <script src="js/overview.js"></script>
    <script src="js/devices.js"></script>
    <script src="js/sensors.js"></script>
    <script src="js/actuators.js"></script>
</body>
</html>
